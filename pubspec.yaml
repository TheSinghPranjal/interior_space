name: interior_space
description: "3D Room Designer & Visualizer - Design and explore rooms in real-time 3D."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_inappwebview: ^6.1.5
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  flutter_colorpicker: ^1.1.0
  screenshot: ^3.0.0
  pdf: ^3.11.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  collection: ^1.19.1
  google_fonts: ^6.2.1
  archive: ^4.0.7
  media_store_plus: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/three/viewer.html
    - assets/textures/
    - assets/icon/room_dimension.png
    - assets/icon/room_plant.png
